<div id="concourse-workspace-preview">
  <style>
    #concourse-workspace-preview{--cw-bg:light-dark(#f5f7f1,#111e19);--cw-panel:light-dark(#ffffff,#182820);--cw-ink:light-dark(#19382d,#e1eee4);--cw-muted:light-dark(#5d7066,#aac0b2);--cw-line:light-dark(#dbe4da,#344b3d);--cw-green:light-dark(#276c4d,#9ed8a5);--cw-soft:light-dark(#edf3e8,#233c2c);--cw-selected:light-dark(#e3eeda,#30503a);--cw-row-pad:13px;color-scheme:light dark;color:var(--cw-ink);font:14px/1.5 system-ui,sans-serif}
    #concourse-workspace-preview *{box-sizing:border-box}#concourse-workspace-preview [hidden]{display:none!important}#concourse-workspace-preview button,#concourse-workspace-preview input,#concourse-workspace-preview select{font:inherit;color:inherit}#concourse-workspace-preview button{border:1px solid var(--cw-line);background:var(--cw-panel);border-radius:5px;padding:7px 11px}#concourse-workspace-preview input,#concourse-workspace-preview select{border:1px solid var(--cw-line);border-radius:5px;padding:8px;background:var(--cw-panel);width:100%;min-width:0}#concourse-workspace-preview h1{font-size:23px;font-weight:600;letter-spacing:-.6px;margin:0}#concourse-workspace-preview h2{font-size:17px;font-weight:600;margin:0}#concourse-workspace-preview h3{font-size:15px;font-weight:600;margin:0}#concourse-workspace-preview p{margin:0}#concourse-workspace-preview small{font-size:12px;color:var(--cw-muted)}#concourse-workspace-preview .cw-shell{background:var(--cw-bg);border:1px solid var(--cw-line);border-radius:10px;overflow:hidden}#concourse-workspace-preview .cw-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;background:var(--cw-panel);border-bottom:1px solid var(--cw-line)}#concourse-workspace-preview .cw-brand{font-weight:700;letter-spacing:-.6px;font-size:19px}#concourse-workspace-preview .cw-top-right{display:flex;align-items:center;gap:12px;padding-right:80px}#concourse-workspace-preview .cw-badge{display:inline-flex;align-items:center;border-radius:4px;padding:3px 7px;background:var(--cw-soft);color:var(--cw-green);font-size:12px;white-space:nowrap}#concourse-workspace-preview .cw-app{display:grid;grid-template-columns:138px minmax(0,1fr)}#concourse-workspace-preview .cw-nav{padding:18px 10px;background:var(--cw-panel);border-right:1px solid var(--cw-line);display:flex;flex-direction:column;gap:7px}#concourse-workspace-preview .cw-nav button{text-align:left;border-color:transparent;background:transparent}#concourse-workspace-preview .cw-nav button[aria-pressed="true"]{background:var(--cw-selected);color:var(--cw-green);font-weight:600}#concourse-workspace-preview .cw-main{padding:22px;min-width:0}#concourse-workspace-preview .cw-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}#concourse-workspace-preview .cw-context{margin-top:4px;color:var(--cw-muted);font-size:12px}#concourse-workspace-preview .cw-period{width:145px}#concourse-workspace-preview .cw-toolbar{display:grid;grid-template-columns:minmax(150px,2fr) repeat(2,minmax(105px,1fr));gap:10px;margin-bottom:18px;padding:14px;background:var(--cw-panel);border:1px solid var(--cw-line);border-radius:7px}#concourse-workspace-preview .cw-toolbar label{display:block;min-width:0;font-size:12px;color:var(--cw-muted)}#concourse-workspace-preview .cw-toolbar label>input,#concourse-workspace-preview .cw-toolbar label>select{margin-top:4px;font-size:14px;color:var(--cw-ink)}#concourse-workspace-preview .cw-form-actions{display:flex;align-items:end;gap:8px;flex-wrap:wrap}#concourse-workspace-preview .cw-primary{background:var(--cw-green);color:light-dark(#fff,#12251b);border-color:var(--cw-green)}#concourse-workspace-preview .cw-cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:22px}#concourse-workspace-preview .cw-section{background:var(--cw-panel);border:1px solid var(--cw-line);border-radius:7px;padding:17px;min-width:0}#concourse-workspace-preview .cw-metrics{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}#concourse-workspace-preview .cw-metrics button{flex:1;min-width:70px;text-align:left;padding:10px;background:var(--cw-soft)}#concourse-workspace-preview .cw-number{display:block;font-size:26px;font-weight:600;color:var(--cw-green);font-variant-numeric:tabular-nums}#concourse-workspace-preview .cw-two{display:grid;grid-template-columns:1fr 1fr;gap:15px}#concourse-workspace-preview .cw-recent{list-style:none;margin:12px 0 0;padding:0}#concourse-workspace-preview .cw-recent li+li{border-top:1px solid var(--cw-line)}#concourse-workspace-preview .cw-recent button{display:block;border:0;background:transparent;border-radius:0;text-align:left;padding:11px 0;width:100%}#concourse-workspace-preview .cw-recent small{display:block;margin-top:4px}#concourse-workspace-preview .cw-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}#concourse-workspace-preview .cw-layout.cw-split{grid-template-columns:minmax(0,1.15fr) minmax(240px,1fr)}#concourse-workspace-preview .cw-table{width:100%;border-collapse:collapse;background:var(--cw-panel);border:1px solid var(--cw-line);border-radius:6px}#concourse-workspace-preview .cw-table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;color:var(--cw-muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--cw-line)}#concourse-workspace-preview .cw-table td{padding:var(--cw-row-pad) 12px;vertical-align:top;border-bottom:1px solid var(--cw-line)}#concourse-workspace-preview .cw-table tr[aria-selected="true"]{background:var(--cw-soft)}#concourse-workspace-preview .cw-row-link{border:0;background:transparent;padding:0;text-align:left;font-weight:500;overflow-wrap:anywhere}#concourse-workspace-preview .cw-row-meta{display:block;margin-top:5px;overflow-wrap:anywhere}#concourse-workspace-preview .cw-paging{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}#concourse-workspace-preview .cw-paging div{display:flex;gap:8px}#concourse-workspace-preview .cw-detail{padding:17px;background:var(--cw-panel);border:1px solid var(--cw-line);border-radius:7px;min-width:0}#concourse-workspace-preview .cw-detail>div,#concourse-workspace-preview .cw-detail>p,#concourse-workspace-preview .cw-detail>h3{margin-top:14px}#concourse-workspace-preview .cw-detail h2{margin-top:13px;overflow-wrap:anywhere}#concourse-workspace-preview .cw-context-filter{display:block;margin-top:9px}#concourse-workspace-preview .cw-message{padding:13px;background:var(--cw-soft);border-radius:5px;overflow-wrap:anywhere}#concourse-workspace-preview .cw-message p{margin-top:6px}#concourse-workspace-preview .cw-review-form{display:flex;align-items:end;gap:8px}#concourse-workspace-preview .cw-review-form label{flex:1;font-size:12px;color:var(--cw-muted)}#concourse-workspace-preview .cw-review-form select{margin-top:5px}#concourse-workspace-preview .cw-notice{padding:9px;background:var(--cw-soft);border-radius:5px;color:var(--cw-muted);font-size:12px}#concourse-workspace-preview .cw-footer{padding:12px 20px;border-top:1px solid var(--cw-line);background:var(--cw-panel);display:flex;justify-content:space-between;gap:12px;color:var(--cw-muted);font-size:11px}#concourse-workspace-preview .cw-result-label{margin-bottom:10px;color:var(--cw-muted);font-size:12px}#concourse-workspace-preview .cw-live{margin-top:12px;color:var(--cw-green);font-size:12px}#concourse-workspace-preview button:disabled{opacity:.5}#concourse-workspace-preview .cw-history{padding-left:20px;color:var(--cw-muted);font-size:12px}#concourse-workspace-preview .cw-history li{margin-top:7px}
    @media(max-width:850px){#concourse-workspace-preview .cw-layout.cw-split{grid-template-columns:1fr}#concourse-workspace-preview .cw-layout.cw-split .cw-results:has(+.cw-detail:not([hidden])){display:none}#concourse-workspace-preview .cw-table .cw-date{display:none}#concourse-workspace-preview .cw-top-right{padding-right:0}}
    @media(max-width:620px){#concourse-workspace-preview .cw-app{grid-template-columns:1fr}#concourse-workspace-preview .cw-nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--cw-line);padding:8px;flex-wrap:wrap}#concourse-workspace-preview .cw-main{padding:14px}#concourse-workspace-preview .cw-cards,#concourse-workspace-preview .cw-two{grid-template-columns:1fr}#concourse-workspace-preview .cw-toolbar{grid-template-columns:1fr 1fr}#concourse-workspace-preview .cw-toolbar .cw-search{grid-column:1/-1}#concourse-workspace-preview .cw-heading{align-items:start;flex-wrap:wrap}#concourse-workspace-preview .cw-top{padding:12px}#concourse-workspace-preview .cw-top-right small{display:none}#concourse-workspace-preview .cw-footer{flex-wrap:wrap}#concourse-workspace-preview button{min-height:40px}}
  </style>
  <div class="cw-shell" aria-label="Concourse maintainer workspace design">
    <header class="cw-top"><div><span class="cw-brand">concourse</span><small> / Workspace</small></div><div class="cw-top-right"><span class="cw-badge">Sample data</span><small>Feedback maintainer · Discussion moderator</small></div></header>
    <div class="cw-app"><nav class="cw-nav" aria-label="Workspace"><button type="button" data-view="overview" aria-pressed="true">Overview</button><button type="button" data-view="feedback" aria-pressed="false">Feedback</button><button type="button" data-view="discussions" aria-pressed="false">Discussions</button></nav>
      <main class="cw-main"><div class="cw-heading"><div><h1 data-heading>Overview</h1><p class="cw-context" data-context>Concourse · Your review queues</p></div><label class="cw-period" data-overview-period>Period<select aria-label="Overview period"><option value="all">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label></div>
        <form class="cw-toolbar" data-query-form hidden><label class="cw-search">Search<input name="q" type="search" placeholder="Words in feedback or comments" autocomplete="off"></label><label data-kind-label>Type<select name="kind"><option value="all">All types</option><option value="problem">Problem</option><option value="question">Question</option><option value="suggestion">Suggestion</option></select></label><label>Status<select name="status"></select></label><label>Page path<input name="resource" placeholder="All pages" autocomplete="off"></label><label><span data-date-label>Received</span><select name="period"><option value="all">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label><label>Sort<select name="sort"></select></label><div class="cw-form-actions"><button type="button" data-apply class="cw-primary">Apply</button><button type="button" data-reset>Reset</button></div></form>
        <div data-overview></div><div data-queue hidden><p class="cw-result-label" data-result-label aria-live="polite"></p><div class="cw-layout"><div class="cw-results"><table class="cw-table"><thead><tr><th>Feedback</th><th>Status</th><th class="cw-date">Received</th></tr></thead><tbody></tbody></table><div class="cw-paging"><small data-page-label></small><div><button type="button" data-page="back">Back</button><button type="button" data-page="next">Next</button></div></div><p data-empty hidden>No matches. Change or reset your filters.</p></div><aside class="cw-detail" aria-label="Selected item" hidden></aside></div></div><p class="cw-live" role="status" aria-live="polite" data-announcement></p>
      </main></div><footer class="cw-footer"><span>Concourse installation · Private workspace</span><span>Design preview · Changes stay in this sample</span></footer>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('concourse-workspace-preview');
    const n=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};
    const day=d=>`2026-11-${String(d).padStart(2,'0')}T14:00:00Z`;
    const feedback=[
      {id:101,title:'The comment draft disappears after Google sign-in',kind:'problem',status:'new',resource:'guide.html',anchor:'install-static',createdAt:day(23),author:'Reviewer A',body:'I wrote a draft, followed the sign-in link, and returned to an empty form. Could we retain the draft while signing in?'},
      {id:100,title:'Can I use Concourse behind Databricks Apps?',kind:'question',status:'new',resource:'hosting.html',anchor:'databricks',createdAt:day(23),author:'Reviewer B',body:'We publish documents through a Databricks Apps proxy. How will the same comment and feedback service fit that hosting profile?'},
      {id:99,title:'Link each report back to its source section',kind:'suggestion',status:'in_review',resource:'index.html',anchor:'try-it',createdAt:day(22),author:'Reviewer C',body:'A direct source-section link would make it easier to review the context without losing my place in the feedback queue.'},
      {id:98,title:'The feedback widget overlaps navigation on mobile',kind:'problem',status:'in_review',resource:'index.html',anchor:'how-it-works',createdAt:day(21),author:'Reviewer A',body:'On a narrow screen the expanded feedback form covers navigation. A full-screen detail step might be easier to use.'},
      {id:97,title:'How do maintainers see another site’s feedback?',kind:'question',status:'new',resource:'hosting.html',anchor:'public-private',createdAt:day(20),author:'Reviewer D',body:'Will a workspace cover one publication or all our microsites? Please make the scope of the counts clear.'},
      {id:96,title:'Show a reference after feedback is saved',kind:'suggestion',status:'closed',resource:'guide.html',anchor:'feedback',createdAt:day(19),author:'Reviewer B',body:'A short reference helps me tell whether my feedback was accepted without making it public.'},
      {id:95,title:'Comments load twice after following a section link',kind:'problem',status:'closed',resource:'guide.html',anchor:'verify',createdAt:day(18),author:'Reviewer C',body:'Following a section link appears to start a second comments request. Is the component mounted only once?'},
      {id:94,title:'Let me filter the queue to one page',kind:'suggestion',status:'new',resource:'guide.html',anchor:'feedback',createdAt:day(17),author:'Reviewer A',body:'When reviewing the integration guide I want to see only feedback about that page.'},
      {id:93,title:'Do new revisions keep existing comments?',kind:'question',status:'closed',resource:'index.html',anchor:'how-it-works',createdAt:day(15),author:'Reviewer D',body:'How does a conversation stay identifiable if the content gets a new revision?'},
      {id:92,title:'Record review progress without editing the submission',kind:'suggestion',status:'new',resource:'hosting.html',anchor:'limits',createdAt:day(14),author:'Reviewer B',body:'New, In review, and Closed would help us share the queue while keeping the original report intact.'}
    ].map(x=>({...x,version:0,revision:'sample-r1',history:[]}));
    const discussions=[
      {id:201,title:'What should happen to a draft during login?',status:'open',resource:'guide.html',anchor:'install-static',createdAt:day(18),activityAt:day(23),author:'Reviewer A',body:'The installation example should explain how a reader returns to the same section after sign-in.',replies:[{author:'Reviewer B',body:'The draft should survive the login round trip as well.',revision:'sample-r1'},{author:'Reviewer A',body:'Agreed. This is why the source context and pending request need to stay together.',revision:'sample-r2'}]},
      {id:202,title:'Keep private feedback separate from comments',status:'resolved',resource:'index.html',anchor:'try-it',createdAt:day(19),activityAt:day(22),author:'Reviewer C',body:'Readers should know which channel is public to members and which one reaches only maintainers.',replies:[{author:'Reviewer D',body:'The separate feedback visibility label addresses this.',revision:'sample-r1'}]},
      {id:203,title:'How should the Batten hosting profile work?',status:'open',resource:'hosting.html',anchor:'databricks',createdAt:day(20),activityAt:day(23),author:'Reviewer B',body:'The collaboration service and static publication plugin need separate responsibilities.',replies:[{author:'Reviewer C',body:'We also need to qualify the Apps proxy identity and volume access.',revision:'sample-r1'}]},
      {id:204,title:'Make older revision context explicit',status:'open',resource:'guide.html',anchor:'verify',createdAt:day(17),activityAt:day(21),author:'Reviewer D',body:'An older comment should keep the revision it discussed.',replies:[{author:'Reviewer A',body:'A reply can discuss the newer revision without changing the root.',revision:'sample-r2'}]},
      {id:205,title:'Use stable identifiers for source sections',status:'resolved',resource:'index.html',anchor:'how-it-works',createdAt:day(16),activityAt:day(19),author:'Reviewer C',body:'Generated heading IDs can drift when titles change.',replies:[{author:'Reviewer B',body:'Authored stable IDs are the integration requirement.',revision:'sample-r1'}]},
      {id:206,title:'What does resolving a thread mean?',status:'open',resource:'hosting.html',anchor:'limits',createdAt:day(14),activityAt:day(18),author:'Reviewer A',body:'It should mark review progress without deleting the conversation.',replies:[{author:'Reviewer D',body:'And a new reply should bring a resolved conversation back to attention.',revision:'sample-r1'}]}
    ].map(x=>({...x,version:0,revision:'sample-r1',history:[]}));
    const labels={new:'New',in_review:'In review',closed:'Closed',open:'Open',resolved:'Resolved'};
    const blank=v=>({q:'',kind:'all',status:'all',resource:'',period:'all',sort:v==='feedback'?'newest':'activity',page:0});
    const state={view:'overview',selected:null,overviewPeriod:'all',queries:{feedback:blank('feedback'),discussions:blank('discussions')},layout:'Split view',density:'Comfortable'};
    const saved=window.openai?.widgetState?.privateContent;
    if(saved&&['overview','feedback','discussions'].includes(saved.view))state.view=saved.view;
    const form=root.querySelector('[data-query-form]'),queue=root.querySelector('[data-queue]'),overview=root.querySelector('[data-overview]'),pane=root.querySelector('.cw-detail'),layout=root.querySelector('.cw-layout');
    const data=v=>v==='feedback'?feedback:discussions;
    const stamp=s=>new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
    function periodMatch(item,p,v){if(p==='all')return true;const from=Date.UTC(2026,10,24-Number(p));return new Date(v==='feedback'?item.createdAt:item.activityAt).getTime()>=from;}
    const normalWords=s=>' '+s.normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';
    function matching(v,q){const terms=q.q.trim().toLowerCase().split(/\s+/).filter(Boolean);return data(v).filter(x=>{const fields=[x.title,x.body,x.resource,x.author,...(x.replies??[]).map(y=>y.body)].map(normalWords);return terms.every(t=>fields.some(text=>text.includes(' '+normalWords(t).trim()+' ')))&&(q.kind==='all'||x.kind===q.kind)&&(q.status==='all'||x.status===q.status)&&(!q.resource||x.resource===q.resource)&&periodMatch(x,q.period,v);}).sort((a,b)=>q.sort==='kind'?a.kind.localeCompare(b.kind)||b.id-a.id:q.sort==='activity'?b.activityAt.localeCompare(a.activityAt)||b.id-a.id:q.sort==='oldest'?a.createdAt.localeCompare(b.createdAt)||a.id-b.id:b.createdAt.localeCompare(a.createdAt)||b.id-a.id);}
    function persist(){window.openai?.setWidgetState?.({modelContent:{view:state.view},privateContent:{view:state.view}})?.catch(()=>{});}
    function go(v,status,period){state.view=v;state.selected=null;if(status){state.queries[v]={...blank(v),status,period:period??'all'};}syncForm();render();persist();}
    function option(s,value,text){const o=n('option',text);o.value=value;s.append(o);}
    function syncForm(){if(state.view==='overview')return;const v=state.view,q=state.queries[v];form.elements.q.value=q.q;form.elements.kind.value=q.kind;form.elements.resource.value=q.resource;form.elements.period.value=q.period;const status=form.elements.status;status.replaceChildren();option(status,'all','All statuses');for(const key of v==='feedback'?['new','in_review','closed']:['open','resolved'])option(status,key,labels[key]);status.value=q.status;const sort=form.elements.sort;sort.replaceChildren();for(const [key,text] of v==='feedback'?[['newest','Newest first'],['oldest','Oldest first'],['kind','Type']]:[['activity','Recent activity'],['newest','Newest threads'],['oldest','Oldest threads']])option(sort,key,text);sort.value=q.sort;}
    function metric(parent,label,count,v,status){const b=n('button',undefined,'cursor-interaction');b.type='button';b.append(n('span',String(count),'cw-number'),n('span',label));b.onclick=()=>go(v,status,state.overviewPeriod);parent.append(b);}
    function recent(parent,v,rows){const list=n('ul',undefined,'cw-recent');for(const x of rows){const li=n('li'),b=n('button',undefined,'cursor-interaction');b.type='button';b.append(n('span',x.title),n('small',`${x.resource} · ${labels[x.status]} · ${stamp(v==='feedback'?x.createdAt:x.activityAt)}`));b.onclick=()=>{go(v);state.selected=x.id;render();};li.append(b);list.append(li);}parent.append(list);}
    function renderOverview(){overview.replaceChildren();const cards=n('div',undefined,'cw-cards');for(const v of ['feedback','discussions']){const rows=data(v).filter(x=>periodMatch(x,state.overviewPeriod,v));const card=n('section',undefined,'cw-section');card.append(n('h2',v==='feedback'?'Feedback':'Discussions'),n('small',v==='feedback'?'Received in the selected period':'Active in the selected period'));const m=n('div',undefined,'cw-metrics');for(const key of v==='feedback'?['new','in_review','closed']:['open','resolved'])metric(m,labels[key],rows.filter(x=>x.status===key).length,v,key);card.append(m);cards.append(card);}overview.append(cards);const recentGrid=n('div',undefined,'cw-two');for(const v of ['feedback','discussions']){const card=n('section',undefined,'cw-section');card.append(n('h2',v==='feedback'?'Recent feedback':'Recent discussions'));const q={...blank(v),period:state.overviewPeriod};recent(card,v,matching(v,q).slice(0,3));recentGrid.append(card);}overview.append(recentGrid);}
    function renderQueue(){const v=state.view,q=state.queries[v],rows=matching(v,q);q.page=Math.min(q.page,Math.max(0,Math.ceil(rows.length/5)-1));const page=rows.slice(q.page*5,q.page*5+5);root.querySelector('[data-result-label]').textContent=`${rows.length} matching ${v==='feedback'?'feedback items':'threads'} · Counts cover all matches`;root.querySelector('thead th').textContent=v==='feedback'?'Feedback':'Discussion';root.querySelector('thead .cw-date').textContent=v==='feedback'?'Received':'Activity';root.querySelector('[data-kind-label]').hidden=v!=='feedback';root.querySelector('[data-date-label]').textContent=v==='feedback'?'Received':'Last activity';const body=root.querySelector('tbody');body.replaceChildren();for(const x of page){const tr=n('tr');tr.setAttribute('aria-selected',String(state.selected===x.id));const subject=n('td'),b=n('button',x.title,'cw-row-link cursor-interaction');b.type='button';b.dataset.open=String(x.id);subject.append(b,n('small',`${v==='feedback'?x.kind:(x.replies.length+' replies')} · ${x.resource}`,'cw-row-meta'));const status=n('td');status.append(n('span',labels[x.status],'cw-badge'));tr.append(subject,status,n('td',stamp(v==='feedback'?x.createdAt:x.activityAt),'cw-date'));body.append(tr);}root.querySelector('[data-empty]').hidden=rows.length>0;root.querySelector('[data-page-label]').textContent=rows.length?`${q.page*5+1}–${Math.min(rows.length,q.page*5+5)} of ${rows.length}`:'0 results';root.querySelector('[data-page="back"]').disabled=q.page===0;root.querySelector('[data-page="next"]').disabled=(q.page+1)*5>=rows.length;renderDetail(rows);}
    function renderDetail(rows){const v=state.view,x=data(v).find(y=>y.id===state.selected);pane.hidden=!x;pane.replaceChildren();layout.classList.toggle('cw-split',!!x&&state.layout==='Split view');root.querySelector('.cw-results').hidden=!!x&&state.layout==='Full detail';if(!x)return;const back=n('button','Back to results','cursor-interaction');back.type='button';back.onclick=()=>{state.selected=null;render();};pane.append(back,n('h2',x.title),n('small',`#${x.id} · ${labels[x.status]} · version ${x.version}`));if(!rows.some(y=>y.id===x.id))pane.append(n('p','This item no longer matches the current filters.','cw-notice'));const context=n('div');context.append(n('small','Publication context'),n('p',`${x.resource} #${x.anchor}`),n('small',`Original revision: ${x.revision}`));const filter=n('button','Filter to this page','cw-context-filter cursor-interaction');filter.type='button';filter.onclick=()=>{state.queries[v].resource=x.resource;state.queries[v].page=0;syncForm();render();};context.append(filter);pane.append(context);message(x.author,x.body,x.revision);if(v==='discussions')for(const reply of x.replies)message(reply.author,reply.body,reply.revision);const review=n('form',undefined,'cw-review-form'),label=n('label',v==='feedback'?'Triage status':'Thread status'),select=n('select');select.setAttribute('aria-label',v==='feedback'?'Triage status':'Thread status');for(const k of v==='feedback'?['new','in_review','closed']:['open','resolved'])option(select,k,labels[k]);select.value=x.status;label.append(select);const save=n('button','Save status','cw-primary cursor-interaction');save.type='button';review.append(label,save);save.onclick=e=>{e.preventDefault();if(select.value===x.status){announce('Choose a different status.');return;}const from=x.status;x.status=select.value;x.version++;x.history.unshift(`${labels[from]} → ${labels[x.status]} · Maintainer · version ${x.version}`);render();announce('Sample review state saved. Original text is unchanged.');};pane.append(review,n('h3','Review history'));const history=n('ol',undefined,'cw-history');for(const h of x.history)history.append(n('li',h));history.append(n('li',`Received ${stamp(x.createdAt)} · ${x.author}`));pane.append(history);if(v==='discussions')pane.append(n('p','A new reply reopens a resolved thread. Resolving does not lock replies.','cw-notice'));function message(author,body,revision){const m=n('div',undefined,'cw-message');m.append(n('small',`${author} · ${revision}`),n('p',body));pane.append(m);}}
    function announce(text){root.querySelector('[data-announcement]').textContent=text;}
    function render(){for(const b of root.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===state.view));root.querySelector('[data-heading]').textContent={overview:'Overview',feedback:'Feedback',discussions:'Discussions'}[state.view];root.querySelector('[data-context]').textContent=state.view==='overview'?'Concourse · Your review queues':state.view==='feedback'?'Private reports to publication maintainers':'Section conversations and their replies';form.hidden=state.view==='overview';overview.hidden=state.view!=='overview';queue.hidden=state.view==='overview';root.querySelector('[data-overview-period]').hidden=state.view!=='overview';root.style.setProperty('--cw-row-pad',state.density==='Compact'?'8px':'13px');if(state.view==='overview')renderOverview();else renderQueue();}
    root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));const applyQuery=e=>{e.preventDefault();const v=state.view;state.queries[v]={q:form.elements.q.value.trim(),kind:v==='feedback'?form.elements.kind.value:'all',status:form.elements.status.value,resource:form.elements.resource.value.trim(),period:form.elements.period.value,sort:form.elements.sort.value,page:0};state.selected=null;render();persist();};root.querySelector('[data-apply]').onclick=applyQuery;form.onsubmit=applyQuery;form.onkeydown=e=>{if(e.key==='Enter')applyQuery(e);};root.querySelector('[data-reset]').onclick=()=>{state.queries[state.view]=blank(state.view);state.selected=null;syncForm();render();};root.querySelector('[data-overview-period] select').onchange=e=>{state.overviewPeriod=e.target.value;render();};root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.queries[state.view].page+=b.dataset.page==='next'?1:-1;render();});root.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;state.selected=Number(b.dataset.open);render();});syncForm();render();
    if(globalThis.Tweak){const tweaks=new Tweak({container:root,onChange:render});tweaks.addSelect(state,'density',{label:'Queue density',options:['Comfortable','Compact']});tweaks.addSelect(state,'layout',{label:'Detail layout',options:['Split view','Full detail']});}
  })();
  </script>
</div>
