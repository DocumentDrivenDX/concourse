name: Concourse checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: concourse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - run: tofu init -backend=false -input=false
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: python3 ../../scripts/check-publication-order.py
      - run: tofu test
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:workerd
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concourse-local-proof
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: concourse-dist
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [infrastructure, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: concourse-dist
          path: dist/
      - run: python3 scripts/package-release.py
      - name: Publish qualified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease
          --title "Concourse ${GITHUB_REF_NAME#v} — local qualification preview"
          --notes-file docs/helix/05-deploy/release-0.1.0.md
