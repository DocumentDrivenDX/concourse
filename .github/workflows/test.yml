name: Concourse checks
# PR tier: tofu checks + `bun run check` + workerd tests (one runner each, fast).
# Playwright browser suite is heavy: runs on tags, dispatch, weekly, or a PR
# labelled `ci:full`. Release job on tags still needs the full suite.
on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
permissions:
  contents: read
jobs:
  infrastructure:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - run: tofu init -backend=false -input=false
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: python3 ../../scripts/check-publication-order.py
      - run: tofu test
  verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:workerd
      - if: env.FULL == 'true'
        run: bunx playwright install --with-deps chromium
      - if: env.FULL == 'true'
        run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concourse-local-proof
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: concourse-dist
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    needs: [infrastructure, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: concourse-dist
          path: dist/
      - run: python3 scripts/package-release.py
      - name: Publish qualified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease
          --title "Concourse ${GITHUB_REF_NAME#v} — local qualification preview"
          --notes-file release/release-notes.md
